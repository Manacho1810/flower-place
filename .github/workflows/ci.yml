name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      # IMPORTANTE: el proyecto usa rutas hardcodeadas C:\Users\MGI\Documents\...
      # Esto prepara los JSON para que no revienten los tests ni la app.
      - name: Prepare hardcoded JSON files
        shell: pwsh
        run: |
          $base = "C:\Users\MGI\Documents\IngenieriaSoftwareProyecto\flower-place\demo\src\main\java\com\proyecto\demo\Json"
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          Set-Content -Path "$base\producto.json" -Value "[]"
          Set-Content -Path "$base\cliente.json"  -Value "[]"
          Set-Content -Path "$base\pedido.json"   -Value "[]"
          Set-Content -Path "$base\design.json"   -Value "[]"

      - name: Run tests (mvn test)
        working-directory: demo
        run: mvn -B test

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: demo/target/surefire-reports
